server {
    listen 80;
    listen 443 ssl;
    server_name www.seoproga.ru;

    ssl_certificate /etc/letsencrypt/live/seoproga.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seoproga.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://seoproga.ru$request_uri;
}

server {
    listen 80;
    listen 443 ssl;
    server_name seoproga.ru;

    ssl_certificate /etc/letsencrypt/live/seoproga.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seoproga.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /home/barnick/seo-auto-cluster/api/public;
    index index.html;

    if ($request_uri ~ ^/index\.html$) {
        return 301 /;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
