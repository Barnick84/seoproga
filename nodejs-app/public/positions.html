<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Позиции - SEO Keyword Manager</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%232196F3%22/><circle cx=%2250%22 cy=%2250%22 r=%2220%22 fill=%22white%22/><circle cx=%2280%22 cy=%2230%22 r=%2215%22 fill=%22%2300BCD4%22/><circle cx=%2220%22 cy=%2270%22 r=%2215%22 fill=%22%234CAF50%22/><path d=%22M20 70 L50 50 L80 30%22 stroke=%22white%22 stroke-width=%225%22/></svg>">
    <link rel="stylesheet" href="style.css?v=4.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: nowrap;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .filter-bar .btn {
            white-space: nowrap;
        }
        .filter-bar select, .filter-bar input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .data-table th, .data-table td {
            border: 1px solid #eee;
            padding: 10px 12px;
            text-align: left;
        }
        .data-table th {
            background: #f8f9fa;
            font-weight: 600;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }
        .badge-green { background: #e8f5e9; color: #2e7d32; }
        .badge-blue { background: #e3f2fd; color: #1565c0; }
        .badge-orange { background: #fff3e0; color: #e65100; }
        .badge-gray { background: #f5f5f5; color: #616161; }
        .text-center { text-align: center; }
        
        #positionsProgressBanner {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 14px 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            z-index: 2000;
            min-width: 300px;
        }
        
        /* New Table Styles */
        .data-table-container {
            overflow-x: auto;
            position: relative;
            max-width: 100%;
        }
        .data-table th:first-child, .data-table td:first-child {
            position: sticky;
            left: 0;
            background: #fff;
            z-index: 10;
            min-width: 250px;
            box-shadow: 2px 0 5px -2px rgba(0,0,0,0.1);
        }
        .data-table th:first-child {
            background: #f8f9fa;
            z-index: 11;
        }
        
        .cell-green { background: #e8f5e9 !important; }
        .cell-red { background: #ffebee !important; }
        .cell-orange { background: #fff3e0 !important; }
        
        .delta-plus { color: #2e7d32; font-size: 10px; vertical-align: super; font-weight: bold; margin-left: 2px; }
        .delta-minus { color: #c62828; font-size: 10px; vertical-align: super; font-weight: bold; margin-left: 2px; }
        
        .freq-col { width: 60px; text-align: center; color: #666; }
    </style>
</head>
<body>
    <div class="top-menu" id="topMenu" style="display:none;">
        <div class="user-info">
            <div class="logo">SEO Auto Cluster</div>
            <div class="balance-display">
                <span class="balance-label">Баланс:</span>
                <span class="balance-value">0.00 ₽</span>
                <button class="btn-topup-icon" onclick="showTopupModal()" title="Пополнить баланс">+</button>
            </div>
            <div class="menu-tabs">
                <a href="dashboard.html" class="menu-tab">Dashboard</a>
                <a href="sort.html" class="menu-tab">Сортировка</a>
                <a href="cluster.html" class="menu-tab">Кластер</a>
                <a href="positions.html" class="menu-tab active">Позиции</a>
                <a href="cabinet.html" class="menu-tab">Кабинет</a>
            </div>
        </div>
        <div class="site-selector">
            <select id="siteSelect" onchange="selectSite()">
                <option value="">-- Выберите сайт --</option>
            </select>
            <button class="btn-add" onclick="showAddSiteModal()">+ Добавить сайт</button>
            <button class="btn-add" onclick="logout()" style="background:#555; margin-left:10px;">Выйти</button>
        </div>
    </div>

    <div class="container" id="mainApp" style="display:none;">
        <div class="card">
            <h2>Мониторинг позиций</h2>
            
            <div class="filter-bar">
                <select id="filterCluster" onchange="loadPositions()">
                    <option value="all">Все кластеры</option>
                </select>
                <select id="filterEngine" onchange="loadPositions()">
                    <option value="yandex">Яндекс</option>
                    <option value="google">Google</option>
                </select>
                <select id="filterDevice" onchange="loadPositions()">
                    <option value="desktop">Десктоп</option>
                    <option value="mobile">Мобильные</option>
                </select>
                <input type="text" id="dateRangePicker" placeholder="Выберите период">
                <button class="btn btn-primary" id="btnRunPositions" onclick="runPositionsCheck()"><i class="fas fa-sync-alt"></i> Проверить позиции</button>
            </div>

            <div class="data-table-container">
                <table class="data-table">
                    <thead id="positionsTableHeader">
                        <tr>
                            <th>Запрос</th>
                            <th>Кластер</th>
                            <th>Частотность</th>
                            <th>Позиции</th>
                        </tr>
                    </thead>
                    <tbody id="positionsTableBody">
                        <tr><td colspan="4" class="text-center empty-state">Выберите сайт</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Progress Banner -->
    <div id="positionsProgressBanner">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
            <div class="loader-mini"></div>
            <span style="font-weight:600;font-size:14px;">Проверка позиций...</span>
        </div>
        <div id="positionsProgressText" style="font-size:12px;color:#666;margin-bottom:8px;">Запуск...</div>
        <div style="background:#f0f0f0;border-radius:4px;height:6px;">
            <div id="positionsProgressBar" style="background:#2196F3;height:6px;border-radius:4px;width:0%;transition:width 0.3s;"></div>
        </div>
        <div id="positionsProgressCount" style="font-size:11px;color:#999;margin-top:4px;">0 / 0</div>
    </div>

    <div id="authSection" class="auth-section" style="display:none;">
        <div class="auth-tabs">
            <button class="auth-tab active" onclick="showAuthForm('login')">Вход</button>
            <button class="auth-tab" onclick="showAuthForm('register')">Регистрация</button>
        </div>
        <div id="authError" class="status error" style="display:none; margin-bottom:20px;"></div>
        <div id="authForm">
            <input type="text" id="authUsername" placeholder="Логин">
            <div class="password-wrapper">
                <input type="password" id="authPassword" placeholder="Пароль">
                <span class="password-toggle" onclick="togglePasswordVisibility('authPassword')"><i class="fas fa-eye"></i></span>
            </div>
            <button class="btn btn-primary" onclick="submitAuth()">Войти</button>
        </div>
    </div>

    <div id="addSiteModal" class="modal">
        <div class="modal-content">
            <h2>Добавить новый сайт</h2>
            <input type="text" id="newSiteDomain" placeholder="example.com">
            <div class="buttons">
                <button class="btn btn-secondary" onclick="hideAddSiteModal()">Отмена</button>
                <button class="btn btn-primary" onclick="addSite()">Добавить</button>
            </div>
        </div>
    </div>

    <!-- Topup Modal -->
    <div id="topupModal" class="modal">
        <div class="modal-content topup-modal-content">
            <div class="modal-header">
                <span class="modal-title">Пополнение баланса</span>
                <button onclick="closeTopupModal()" class="modal-close">&times;</button>
            </div>
            <div class="topup-input-group">
                <label for="topupAmount">Сумма пополнения (руб.)</label>
                <input type="number" id="topupAmount" value="500" min="500" step="100">
                <div class="topup-hints">
                    <button class="btn-hint" onclick="setTopupAmount(500)">500</button>
                    <button class="btn-hint" onclick="setTopupAmount(1000)">1000</button>
                    <button class="btn-hint" onclick="setTopupAmount(5000)">5000</button>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeTopupModal()">Отмена</button>
                <button class="btn btn-primary" id="btnStartPayment" onclick="startPayment()">Оплатить</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/ru.js"></script>
    <script>
        let positionsData = [];
        let availableDates = [];
        let datePicker = null;

        document.addEventListener('DOMContentLoaded', function() {
            datePicker = flatpickr("#dateRangePicker", {
                mode: "range",
                locale: "ru",
                dateFormat: "Y-m-d",
                showMonths: 2,
                onChange: function(selectedDates, dateStr, instance) {
                    if (selectedDates.length === 2) {
                        loadPositions();
                    } else if (selectedDates.length === 0) {
                        loadPositions();
                    }
                }
            });
        });

        async function onSiteSelected(domain) {
            if (!domain) {
                document.getElementById('positionsTableBody').innerHTML = '<tr><td colspan="4" class="text-center empty-state">Выберите сайт</td></tr>';
                return;
            }
            await loadClusters(domain);
            await loadPositions(domain);
        }

        async function loadClusters(domain) {
            try {
                const res = await authFetch(`/api/positions/clusters?domain=${encodeURIComponent(domain)}`);
                const data = await res.json();
                const select = document.getElementById('filterCluster');
                
                const currentValue = select.value;
                let html = '<option value="all">Все кластеры</option>';
                if (data.success && data.clusters) {
                    data.clusters.forEach(c => {
                        html += `<option value="${c.cluster_id}">${escapeHtml(c.cluster_name)}</option>`;
                    });
                }
                select.innerHTML = html;
                if (currentValue && select.querySelector(`option[value="${currentValue}"]`)) {
                    select.value = currentValue;
                }
            } catch (e) {
                console.error('Error loading clusters:', e);
            }
        }

        async function loadPositions(domain) {
            if (!domain) domain = currentDomain;
            if (!domain) return;
            
            const engine = document.getElementById('filterEngine').value;
            const device = document.getElementById('filterDevice').value;
            const clusterId = document.getElementById('filterCluster').value;
            
            let dateQuery = '';
            const dates = datePicker ? datePicker.selectedDates : [];
            if (dates.length === 2) {
                const start = flatpickr.formatDate(dates[0], "Y-m-d");
                const end = flatpickr.formatDate(dates[1], "Y-m-d");
                dateQuery = `&startDate=${start}&endDate=${end}`;
            }
            
            const tbody = document.getElementById('positionsTableBody');
            tbody.innerHTML = '<tr><td colspan="10" class="text-center"><div class="loader-mini" style="margin: 20px auto;"></div></td></tr>';

            try {
                const url = `/api/positions/history?domain=${encodeURIComponent(domain)}&engine=${engine}&device=${device}&clusterId=${clusterId}${dateQuery}`;
                const res = await authFetch(url);
                const data = await res.json();
                
                if (data.success) {
                    positionsData = data.keywords;
                    availableDates = data.dates;
                    renderPositionsTable();
                } else {
                    tbody.innerHTML = '<tr><td colspan="10" class="text-center empty-state">Ошибка загрузки данных</td></tr>';
                }
            } catch (e) {
                console.error('Error loading positions:', e);
                tbody.innerHTML = '<tr><td colspan="10" class="text-center empty-state">Ошибка соединения</td></tr>';
            }
        }

        function renderPositionsTable() {
            const thead = document.getElementById('positionsTableHeader');
            const tbody = document.getElementById('positionsTableBody');
            
            if (!positionsData || positionsData.length === 0) {
                thead.innerHTML = '<tr><th>Запрос</th><th class="freq-col" title="Частотность"><i class="fas fa-globe"></i></th><th>Позиции</th></tr>';
                tbody.innerHTML = '<tr><td colspan="3" class="text-center empty-state">Нет данных для отображения</td></tr>';
                return;
            }
            
            // Header
            let theadHtml = '<tr><th>Запрос</th><th class="freq-col" title="Частотность"><i class="fas fa-globe"></i></th>';
            availableDates.forEach(date => {
                const [y, m, d] = date.split('-');
                theadHtml += `<th class="text-center">${d}.${m}.${y}</th>`;
            });
            if (availableDates.length === 0) {
                theadHtml += `<th>Позиции</th>`;
            }
            theadHtml += '</tr>';
            thead.innerHTML = theadHtml;
            
            // Body
            let tbodyHtml = '';
            positionsData.forEach(row => {
                tbodyHtml += `<tr>
                    <td>${escapeHtml(row.query)}</td>
                    <td class="text-center" style="color: #666; font-size: 13px;">${row.frequency || 0}</td>`;
                
                if (availableDates.length === 0) {
                    tbodyHtml += `<td class="text-center" style="color: #999;">-</td>`;
                } else {
                    availableDates.forEach((date, i) => {
                        const pos = row.positions[i];
                        const prevPos = i < availableDates.length - 1 ? row.positions[i+1] : null;
                        
                        if (pos && pos.position > 0) {
                            let cellClass = '';
                            let deltaHtml = '';
                            
                            if (prevPos && prevPos.position > 0) {
                                const diff = prevPos.position - pos.position;
                                if (diff > 0) {
                                    cellClass = 'cell-green';
                                    deltaHtml = `<span class="delta-plus">+${diff}</span>`;
                                } else if (diff < 0) {
                                    cellClass = 'cell-red';
                                    deltaHtml = `<span class="delta-minus">${diff}</span>`;
                                }
                            } else {
                                if (pos.position <= 10) cellClass = 'cell-green';
                                else if (pos.position <= 20) cellClass = 'cell-orange';
                            }
                            
                            tbodyHtml += `<td class="text-center ${cellClass}">
                                <div title="${escapeHtml(pos.found_url || '')}">
                                    <span style="font-size:15px;color:#333;">${pos.position}</span>${deltaHtml}
                                </div>
                            </td>`;
                        } else {
                            tbodyHtml += `<td class="text-center" style="color: #ccc;">-</td>`;
                        }
                    });
                }
                tbodyHtml += `</tr>`;
            });
            
            tbody.innerHTML = tbodyHtml;
        }

        async function runPositionsCheck() {
            if (!currentDomain) return alert('Выберите сайт');
            
            const engine = document.getElementById('filterEngine').value;
            const device = document.getElementById('filterDevice').value;
            
            const btn = document.getElementById('btnRunPositions');
            btn.classList.add('btn-loading');
            
            const banner = document.getElementById('positionsProgressBanner');
            const progressText = document.getElementById('positionsProgressText');
            const progressBar = document.getElementById('positionsProgressBar');
            const progressCount = document.getElementById('positionsProgressCount');
            
            banner.style.display = 'block';
            progressText.innerText = 'Запуск...';
            progressBar.style.width = '0%';
            progressBar.style.backgroundColor = '#2196F3';
            progressCount.innerText = '0 / 0';
            
            try {
                const session = localStorage.getItem('session');
                const url = `/api/positions/run-stream?domain=${encodeURIComponent(currentDomain)}&engine=${engine}&device=${device}`;
                const response = await fetch(url, {
                    headers: { 'Authorization': session || '' }
                });

                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const events = buffer.split('\n\n');
                    buffer = events.pop(); 
                    
                    for (const event of events) {
                        if (event.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(event.substring(6));
                                if (data.type === 'progress') {
                                    progressBar.style.width = `${data.pct}%`;
                                    progressCount.innerText = `${data.done} / ${data.total}`;
                                    if (data.message) progressText.innerText = data.message;
                                } else if (data.type === 'done') {
                                    progressText.innerText = 'Успешно завершено';
                                    progressBar.style.width = `100%`;
                                    progressBar.style.backgroundColor = '#4CAF50'; // Green
                                    setTimeout(() => { banner.style.display = 'none'; }, 3000);
                                    loadPositions(currentDomain);
                                } else if (data.type === 'error') {
                                    progressText.innerText = `Ошибка: ${data.message}`;
                                    progressBar.style.backgroundColor = '#F44336'; // Red
                                    setTimeout(() => { banner.style.display = 'none'; }, 5000);
                                }
                            } catch (e) {
                                console.error('Error parsing SSE chunk:', e);
                            }
                        }
                    }
                }
            } catch (e) {
                console.error(e);
                alert('Ошибка при запуске проверки позиций');
                banner.style.display = 'none';
            } finally {
                btn.classList.remove('btn-loading');
            }
        }
    </script>
</body>
</html>
